name: Weekly competitor scrape

on:
  schedule:
    # 14:00 UTC Sunday = 12am Mon AEST / 1am Mon AEDT — proper overnight, full 12-month scrape
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD). Leave blank for tomorrow.'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD). Leave blank for tomorrow + 365 days.'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: node scrape.js

      - name: Run digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIGEST_WEBHOOK_URL: ${{ secrets.DIGEST_WEBHOOK_URL }}
        run: node digest.js

      - name: Upload debug screenshots if any
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots
          path: 'debug-*.png'
          if-no-files-found: ignore
          retention-days: 7