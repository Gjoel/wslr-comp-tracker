name: Scrape competitor rates

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, optional — defaults to tomorrow)'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD, optional — defaults to start + 365 days)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: node scrape.js

      # The digest email is no longer sent after every scrape.
      # It now goes out weekly — see weekly-digest.yml.

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload data dump
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: data-dumps
          path: dump-*.json
          if-no-files-found: ignore
          retention-days: 7